<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiante - Sistema de Prevención de Virus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
            padding: 20px;
        }
        .form-container {
            max-width: 650px;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #1e73be;
            margin-bottom: 5px;
        }
        p.sub-title {
            text-align: center;
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .inline-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button[type="submit"] {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button[type="submit"]:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        button[type="submit"]:hover:not(:disabled) {
            background-color: #218838;
        }
        .resumen-card {
            margin-top: 25px;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
            border-left: 5px solid #1e73be;
        }
        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registro de Usuario - Sistema de Prevención de Virus</h2>
    <p class="sub-title"><em>IE La Candelaria - Proyecto Pedagógico Integrador (PPI)</em></p>

    <form id="registroForm" novalidate>
        
        <!-- 1. Nombre completo -->
        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Ronald Zapata">
            <div id="errorNombre" class="error-msg"></div>
        </div>

        <!-- 2. Correo electrónico -->
        <div class="form-group">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
            <div id="errorCorreo" class="error-msg"></div>
        </div>

        <!-- 3. Contraseña -->
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password">
            <div id="errorPassword" class="error-msg"></div>
        </div>

        <!-- 4. Edad -->
        <div class="form-group">
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="1" max="100">
            <div id="errorEdad" class="error-msg"></div>
        </div>

        <!-- 5. Fecha de nacimiento -->
        <div class="form-group">
            <label for="fecha_nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
            <div id="errorFecha" class="error-msg"></div>
        </div>

        <!-- 6. Range / Nivel de experiencia -->
        <div class="form-group">
            <label for="nivel_experiencia">Nivel de experiencia en ciberseguridad (1-10): <span id="rangeVal">5</span></label>
            <input type="range" id="nivel_experiencia" name="nivel_experiencia" min="1" max="10" value="5">
        </div>

        <!-- 7. Radio / Modalidad -->
        <div class="form-group">
            <label>Modalidad de capacitación / asesoría:</label>
            <div class="inline-group">
                <label><input type="radio" name="modalidad" value="Presencial"> Presencial (IE La Candelaria)</label>
                <label><input type="radio" name="modalidad" value="Virtual"> Virtual</label>
            </div>
            <div id="errorModalidad" class="error-msg"></div>
        </div>

        <!-- 8. Select / País -->
        <div class="form-group">
            <label for="pais">País de residencia:</label>
            <select id="pais" name="pais">
                <option value="">-- Seleccione un país --</option>
                <option value="Colombia">Colombia</option>
                <option value="México">México</option>
                <option value="Argentina">Argentina</option>
                <option value="España">España</option>
                <option value="Otro">Otro</option>
            </select>
            <div id="errorPais" class="error-msg"></div>
        </div>

        <!-- 9. Checkboxes múltiples / Lenguajes -->
        <div class="form-group">
            <label>Sistemas operativos / Lenguajes que conoce o utiliza:</label>
            <div class="inline-group">
                <label><input type="checkbox" name="lenguajes" value="Windows/Linux"> Windows/Linux</label>
                <label><input type="checkbox" name="lenguajes" value="JS/Python"> JS / Python</label>
                <label><input type="checkbox" name="lenguajes" value="Java/C++"> Java / C++</label>
            </div>
        </div>

        <!-- 10. Textarea / Comentarios -->
        <div class="form-group">
            <label for="comentarios">¿Qué virus o problemas de seguridad informáticos has tenido previamente?</label>
            <textarea id="comentarios" name="comentarios" rows="3" placeholder="Escribe aquí los virus o ataques que conozcas o hayas sufrido..."></textarea>
        </div>

        <!-- 11. File / Foto de perfil + Vista previa -->
        <div class="form-group">
            <label for="foto">Foto de perfil / Documento de identificación:</label>
            <input type="file" id="foto" name="foto" accept="image/*">
            <div id="vistaPreviaCont" style="margin-top: 10px; display: none;">
                <p style="margin: 0; font-size: 12px; font-weight: bold;">Vista previa de la imagen:</p>
                <img id="vistaPrevia" src="" alt="Vista previa" style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px;">
            </div>
        </div>

        <!-- 12. Color preferido -->
        <div class="form-group">
            <label for="color_favorito">Color preferido para la interfaz:</label>
            <input type="color" id="color_favorito" name="color_favorito" value="#1e73be">
        </div>

        <!-- 13. Aceptar términos (deshabilita el botón) -->
        <div class="form-group">
            <label>
                <input type="checkbox" id="terminos" name="terminos"> Acepto las políticas de seguridad y uso de la plataforma PPI.
            </label>
        </div>

        <!-- 14. Botón Submit -->
        <div class="form-group">
            <button type="submit" id="btnEnviar" disabled>Enviar Registro</button>
        </div>

    </form>

    <!-- Resumen final -->
    <div id="resumenContenedor" style="display: none;" class="resumen-card">
        <h3 style="margin-top:0;">📋 Resumen del Registro</h3>
        <div id="resumenContenido"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('registroForm');
        const terminos = document.getElementById('terminos');
        const btnEnviar = document.getElementById('btnEnviar');
        const rangeInput = document.getElementById('nivel_experiencia');
        const rangeVal = document.getElementById('rangeVal');
        const fotoInput = document.getElementById('foto');
        const vistaPrevia = document.getElementById('vistaPrevia');
        const vistaPreviaCont = document.getElementById('vistaPreviaCont');
        let fotoURL = '';

        // 1. Mostrar valor del Range en tiempo real
        rangeInput.addEventListener('input', (e) => {
            rangeVal.textContent = e.target.value;
        });

        // 2. Activar/Desactivar botón según Checkbox de Términos
        terminos.addEventListener('change', (e) => {
            btnEnviar.disabled = !e.target.checked;
        });

        // 3. Vista previa de la imagen cargada
        fotoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fotoURL = URL.createObjectURL(file);
                vistaPrevia.src = fotoURL;
                vistaPreviaCont.style.display = 'block';
            } else {
                vistaPreviaCont.style.display = 'none';
                fotoURL = '';
            }
        });

        // Limpiar mensajes de error
        function limpiarErrores() {
            document.querySelectorAll('.error-msg').forEach(el => el.textContent = '');
        }

        // 4. Capturar Envío del Formulario
        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Evita que se recargue o redireccione
            limpiarErrores();

            let hayError = false;

            // Obtener valores
            const nombre = document.getElementById('nombre').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const password = document.getElementById('password').value;
            const edadStr = document.getElementById('edad').value;
            const edad = parseInt(edadStr, 10);
            const fechaNacimiento = document.getElementById('fecha_nacimiento').value;
            const pais = document.getElementById('pais').value;
            const modalidadSelect = document.querySelector('input[name="modalidad"]:checked');

            // Validaciones
            if (!nombre) {
                document.getElementById('errorNombre').textContent = 'El nombre es obligatorio.';
                hayError = true;
            }

            const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!correo || !regexEmail.test(correo)) {
                document.getElementById('errorCorreo').textContent = 'Ingresa un correo electrónico válido.';
                hayError = true;
            }

            if (!password) {
                document.getElementById('errorPassword').textContent = 'La contraseña es obligatoria.';
                hayError = true;
            }

            if (!edadStr || isNaN(edad) || edad <= 0) {
                document.getElementById('errorEdad').textContent = 'La edad debe ser un número mayor a 0.';
                hayError = true;
            }

            if (!fechaNacimiento) {
                document.getElementById('errorFecha').textContent = 'Selecciona tu fecha de nacimiento.';
                hayError = true;
            }

            if (!modalidadSelect) {
                document.getElementById('errorModalidad').textContent = 'Selecciona una modalidad.';
                hayError = true;
            }

            if (!pais) {
                document.getElementById('errorPais').textContent = 'Selecciona tu país.';
                hayError = true;
            }

            // Si hay errores de validación, detiene el envío
            if (hayError) return;

            // Procesar resto de valores
            const lenguajesCheckboxes = document.querySelectorAll('input[name="lenguajes"]:checked');
            const lenguajes = Array.from(lenguajesCheckboxes).map(cb => cb.value).join(', ') || 'Ninguno seleccionado';
            const comentarios = document.getElementById('comentarios').value.trim() || 'Sin comentarios';
            const color = document.getElementById('color_favorito').value;

            // Generar el HTML con el resumen
            const resumenHTML = `
                <p><strong>Nombre:</strong> ${nombre}</p>
                <p><strong>Correo:</strong> ${correo}</p>
                <p><strong>Edad:</strong> ${edad}</p>
                <p><strong>Fecha de Nacimiento:</strong> ${fechaNacimiento}</p>
                <p><strong>Nivel de Experiencia:</strong> ${rangeInput.value} / 10</p>
                <p><strong>Modalidad:</strong> ${modalidadSelect.value}</p>
                <p><strong>País:</strong> ${pais}</p>
                <p><strong>Lenguajes/Sistemas:</strong> ${lenguajes}</p>
                <p><strong>Comentarios:</strong> ${comentarios}</p>
                <p><strong>Color de interfaz:</strong> <span style="background-color:${color}; color:#fff; padding: 2px 8px; border-radius: 3px;">${color}</span></p>
                ${fotoURL ? `<p><strong>Foto subida:</strong><br><img src="${fotoURL}" style="width:100px; height:100px; object-fit:cover; border-radius:8px; margin-top:5px;"></p>` : ''}
            `;

            document.getElementById('resumenContenido').innerHTML = resumenHTML;
            document.getElementById('resumenContenedor').style.display = 'block';

            // Desplazar la pantalla suavemente hasta el resumen
            document.getElementById('resumenContenedor').scrollIntoView({ behavior: 'smooth' });
        });
    });
</script>

</body>
</html>
